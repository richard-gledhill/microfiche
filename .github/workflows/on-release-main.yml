name: release-main

on:
  release:
    types: [published]

jobs:

  attach-wheels:
    # core and cli are released together: both wheels, the same version, which must be the release's tag.
    permissions:
      contents: write # Allows the job to attach files to the release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false # the build and the tests do not need to push; only the upload below uses the token

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build the wheels
        run: uv build --all-packages --wheel -o dist

      - name: Check the wheels against the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: uv run python scripts/check_wheels.py dist --tag "$TAG"

      - name: Install the wheels in a clean environment
        run: bash scripts/smoke_wheels.sh dist

      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/core-*.whl dist/cli-*.whl

  deploy-docs:
    # Not before the wheels are checked and attached: a release that fails that check should not publish its docs either.
    needs: attach-wheels
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run mkdocs build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
