name: Main

# A change to the Markdown docs alone runs docs.yml instead. Its `paths` list must stay identical to `paths-ignore`
# here, so every change runs at least one of the two. The list names Markdown outside tests/ only: the tests read the
# .md files in their fixture libraries, and the package READMEs go into the wheels.
on:
  push:
    branches:
      - main
    paths-ignore: ["*.md", ".junie/*.md", "microfiche/*.md", "docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["*.md", ".junie/*.md", "microfiche/*.md", "docs/**"]

# A new push to a pull request cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    # Windows as well as Linux: the junction, locked-file and run-lock code only runs there, and the project is used there.
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy

  coverage:
    # One run with coverage on, enforcing `fail_under` from pyproject.toml. Linux only: it measures the code, and the
    # matrix above is what shows that the code behaves the same everywhere.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests with coverage
        run: uv run python -m pytest --doctest-modules --cov --cov-report=term-missing

  wheels:
    # Builds the release wheels and installs them in a clean environment, so a broken release is found on the pull
    # request that breaks it, not on the day it is cut.
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build and check the wheels
        run: |
          uv build --all-packages --wheel -o dist
          uv run python scripts/check_wheels.py dist

      - name: Install the wheels in a clean environment
        run: bash scripts/smoke_wheels.sh dist

  check-docs:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s
