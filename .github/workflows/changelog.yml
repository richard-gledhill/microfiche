name: Generate Changelog

on:
  push:
    branches:
      - main

jobs:
  changelog:
    runs-on: ubuntu-latest
    name: Generate and Commit Changelog
    permissions:
      contents: write # Allows the workflow to commit the file back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Changelog
        uses: smichard/conventional_changelog@2.0.11
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize trailing newline
        # The generator ends the file with a blank line, which pre-commit's end-of-file-fixer rejects.
        run: printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md

      - name: Set Git User Info
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'

      - name: Commit Changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: :robot: changelog file generated" || echo "No changes to commit"
          git push
