[project]
name = "cli"
version = "0.1.4"
description = "microfiche CLI: organize project reference materials into a structured library."
readme = "README.md"
authors = [
    { name = "Richard G", email = "61820266+richard-gledhill@users.noreply.github.com" }
]
requires-python = ">=3.11, <4.0"
dependencies = [
    "typer",
    "rich",
    "core",
]

[project.scripts]
microfiche = "cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
