[project]
name = "cli"
version = "0.1.5"
description = "microfiche CLI: organize project reference materials into a structured library."
readme = "README.md"
authors = [
    { name = "Richard G", email = "61820266+richard-gledhill@users.noreply.github.com" }
]
requires-python = ">=3.11, <4.0"
dependencies = [
    "typer",
    "rich",
    "core==0.1.5",
]

[project.scripts]
microfiche = "microfiche.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Install as microfiche.cli; see packages/core/pyproject.toml for why the name has two parts.
module-name = "microfiche.cli"

[tool.deptry.package_module_name_map]
core = "microfiche"

[tool.uv.sources]
core = { workspace = true }
