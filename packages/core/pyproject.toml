[project]
name = "core"
version = "0.1.6"
description = "microfiche core: document scanning, classification, filing, and library management logic."
readme = "README.md"
authors = [
    { name = "Richard G", email = "61820266+richard-gledhill@users.noreply.github.com" }
]
requires-python = ">=3.11, <4.0"
dependencies = [
    "pydantic>=2",
    "rapidfuzz>=3.0,<4",
    "pymupdf",
    "python-docx",
    "extract-msg",
]

[project.optional-dependencies]
ai = ["openai", "ollama"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Install as microfiche.core: the distribution stays "core", the import name carries the project's namespace.
# src/microfiche/ must have no __init__.py, so the core and cli wheels can both put a folder inside it.
module-name = "microfiche.core"

[tool.deptry]
# core imports itself as microfiche.core, and deptry cannot see that the "microfiche" folder (a namespace, with no
# __init__.py) is this package's own, so it would call every such import a missing dependency.
known_first_party = ["microfiche"]
