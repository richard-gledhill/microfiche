# Packaged defaults for microfiche-config.toml.
#
# Every setting microfiche reads has its default here, and only here. A library's own
# .microfiche/microfiche-config.toml is merged over this file: tables merge key by key, and a list
# replaces the default list outright. Keep this file in step with the template in microfiche/.

[library_structure]
# The folder at the library root where new documents are dropped: a plain folder name, not a path.
library_inbox = "_sorting"
# Levels of folders: 2 for group then category, 1 for groups only (a flat library).
depth = 2

[classification]
# A document files without asking only if its confidence reaches this (see docs/development/testing/calibration.md).
confidence_threshold = 0.75
# How sure (0 to 1) a match is when a category's name is found in the document text.
name_match_confidence = 0.9
# How sure (0 to 1) a match is when a filename rule applies.
filename_match_confidence = 0.95
# How sure (0 to 1) a match is when one of a category's keyword hints is found in the document text.
hint_match_confidence = 0.75
# How close (0 to 100) a near-miss must be to a group's name to count as that group.
fuzzy_group_threshold = 85

[ai]
# Who answers: "ollama" (on your machine) or "openai" (sends the text of each document it is asked about
# to OpenAI).
provider = "ollama"
# The model to ask. Required with --use-ai; there is no default. Ollama: a model you have pulled, e.g. "llama3.1"
# (`ollama list` shows them, `ollama pull <name>` installs one). OpenAI: a model name, e.g. "gpt-4o-mini".
model = ""
# Where the Ollama server is. Empty means Ollama's default address, http://localhost:11434. Set it for a server on
# another machine, e.g. "http://gpu-box:11434". Ollama only.
host = ""
# Seconds to wait for one answer. A first call can be slow while Ollama loads the model: raise this if it times out.
timeout = 120
# The NAME of the environment variable holding the OpenAI key. The key itself never goes in this file.
api_key_env = "OPENAI_API_KEY"
# How sure any AI answer is. Below [classification] confidence_threshold, an AI-only answer goes to review.
ai_confidence = 0.70
# How much of a document's text is sent to the AI. 0 sends all of it, which costs more tokens and time.
max_document_chars = 4000

[sorting]
# File a folder dropped in the inbox whole, under its dominant group or category. Off files the documents inside
# it one by one, and removes the folder once it is empty.
keep_folders = true
# File and folder names (globs) the inbox scan skips without comment: Office lock files and OS clutter.
ignore = ["~$*", ".DS_Store", "Thumbs.db", "*.tmp"]

[parsing]
# A file bigger than this many megabytes is not read: it stays in the inbox for review, with the reason.
max_file_mb = 50

[logging]
# How much the log file (.microfiche/<file>) records: DEBUG, INFO, WARNING, ERROR or CRITICAL.
level = "INFO"
# The log file's name, inside the library's .microfiche/ folder. A plain file name, not a path, and not the name of
# one of microfiche's own files there (audit.log, ledger.jsonl and so on).
file = "microfiche.log"
# The file is rotated to a backup when it reaches this many bytes.
max_bytes = 1048576
# How many rotated backups to keep. 0 never rotates, so the file grows without limit.
backup_count = 3

[exclusions]
# Folder names (globs) never treated as a group or category and never looked inside: by default anything starting
# with . or _ (such as .obsidian) and inbox-like names. The inbox and .microfiche/ always are. A list replaces this one.
exclude = ["sorting*", "_sorting*", ".*", "_*"]

[naming_rules]
# Regex renames applied to a file's name before it is filed, as { 'pattern' = "replacement" }, in order.
rules = {}
