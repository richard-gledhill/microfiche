# Packaged defaults for microfiche-config.toml.
#
# Every setting microfiche reads has its default here, and only here. A library's own
# .microfiche/microfiche-config.toml is merged over this file: tables merge key by key, and a list
# replaces the default list outright. Keep this file in step with the template in microfiche/.

[library_structure]
library_inbox = "_sorting"
depth = 2
# levels and file_target_level are not read by the code and are removed later in Stage 4.1.
levels = ["group", "category"]
file_target_level = 2

[classification]
confidence_threshold = 0.75

[exclusions]
exclude = []

# Category hints and filing rules move to .microfiche/microfiche-library.json later in Stage 4.1.
[category_hints.categories]

[filing_rules]
rules = []

[naming_rules]
rules = {}

# Not read by the code; removed later in Stage 4.1.
[library_templates]

[obsidian]
enabled = false
tag_index_path = "TagIndex.md"
tag_mode = "suggest"
