site_name: microfiche
repo_url: https://github.com/richard-gledhill/microfiche
site_url: https://richard-gledhill.github.io/microfiche
site_description: Automatically organize, categorize, and file project reference materials into a structured library.
site_author: Richard Gledhill
edit_uri: edit/main/docs/
repo_name: richard-gledhill/microfiche
copyright: Maintained by <a href="https://richard-gledhill.com">richard-gledhill</a>.

nav:
  - Home: index.md
  - Modules: modules.md

# docs/development/ holds internal planning docs - the current architecture.md, archived
# superseded PRD/concept docs, and a README template - not published user-facing
# documentation. Exclude it from the built site rather than force it into the nav.
exclude_docs: |
  development/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["packages/core/src", "packages/cli/src"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/richard-gledhill/microfiche
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/microfiche

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
