site_name: microfiche
repo_url: https://github.com/richard-gledhill/microfiche
site_url: https://richard-gledhill.github.io/microfiche
site_description: A personal library file manager built in python.
site_author: Richard Gledhill
edit_uri: edit/main/docs/
repo_name: richard-gledhill/microfiche
copyright: Maintained by <a href="https://richard-gledhill.com">richard-gledhill</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/microfiche"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/richard-gledhill/microfiche
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/microfiche

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
