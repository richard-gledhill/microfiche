[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = uv
commands =
    uv sync --active --python {envpython}
    # --active: without it, `uv run` warns that VIRTUAL_ENV (tox's per-version env) doesn't
    # match the project's declared .venv and silently falls back to .venv - defeating the
    # whole point of testing each Python version in isolation.
    uv run --active python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    uv run --active mypy
