[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# tox-uv: sync each env from uv.lock into its own venv, leaving the project .venv alone. The `dependencies` group
# installs the workspace packages (core and cli); the root itself is not a package.
runner = uv-venv-lock-runner
dependency_groups =
    dev
    dependencies
passenv = PYTHON_VERSION
commands =
    python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    mypy
