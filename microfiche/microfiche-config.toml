# .microfiche/microfiche-config.toml — this library's microfiche configuration.

# The shape of the library: the name of its inbox, and the depth of the group/category hierarchy.
# library_inbox: the one folder at the library root where new documents are dropped. It must be a
# plain folder name, not a path.
# Depth of the folder hierarchy: 2 for group then category (the default), or 1 for groups only (a flat library).
[library_structure]
library_inbox = "_sorting"
depth = 2

# How confident microfiche must be (0 to 1) before it files a document without asking. Anything
# below this is left in _sorting/ for review. How sure each kind of match is today: exact group or
# category name 0.9-1.0, filename rule 0.95, keyword hint 0.75, AI answer 0.70. The default, 0.75,
# files on all of those except AI answers. Raise it to 0.8 to hold keyword-hint matches for review
# too, or lower it to 0.7 to let AI answers file. It was measured, not guessed: see
# docs/development/testing/calibration.md.
[classification]
confidence_threshold = 0.75
# How sure each kind of match is (0 to 1). The threshold above decides which of them file on their own.
name_match_confidence = 0.9       # a category's name found in the document text
filename_match_confidence = 0.95  # a filename rule
hint_match_confidence = 0.75      # a keyword hint
# How close (0 to 100) a near-miss must be to a group's name to count as that group.
fuzzy_group_threshold = 85
# If the second-best group or category is within this many points (0 to 1) of confidence of the best, hold the
# document for review with both named. 0 holds only exact ties.
ambiguity_margin = 0.1
# Compare folder names, hints and document text in one spelling ("meeting-notes" matches "Meeting Notes", "R&D"
# matches "R and D"). Folders are never renamed.
normalise_names = true

# The AI fallback, used with `sort --use-ai` only for stages the rules can't answer confidently.
[ai]
# "ollama" runs on your machine. "openai" sends the text of each document it is asked about to OpenAI.
provider = "ollama"
# The model to ask. Required with --use-ai; there is no default. Ollama: a model you have pulled, e.g. "llama3.1"
# (`ollama list` shows them, `ollama pull <name>` installs one). OpenAI: a model name, e.g. "gpt-4o-mini".
model = ""
# Where the Ollama server is. Empty means Ollama's default address, http://localhost:11434. Set it for a server on
# another machine, e.g. "http://gpu-box:11434". Ollama only.
host = ""
# Seconds to wait for one answer. A first call can be slow while Ollama loads the model: raise this if it times out.
timeout = 120
# The NAME of the environment variable holding the OpenAI key. The key itself never goes in this file.
api_key_env = "OPENAI_API_KEY"
# How sure any AI answer is (0 to 1). Below the confidence_threshold above, an AI-only answer goes to review.
ai_confidence = 0.70
# How much of a document's text is sent to the AI. 0 sends all of it, which costs more tokens and time.
max_document_chars = 4000

# Whether a folder dropped in the inbox is filed whole, under the category most of its documents
# belong to (true), or its documents are filed one by one and the folder is removed once it is empty
# (false). `sort --keep-folders` and `sort --keep-folders-off`
# override this for a single run: a flag beats this file, which beats the built-in default (true).
[sorting]
keep_folders = true
# File and folder names (globs) the inbox scan skips without comment: Office lock files and OS clutter.
# A skipped file is never read or filed. Setting this replaces the list, it does not add to it.
ignore = ["~$*", ".DS_Store", "Thumbs.db", "*.tmp"]

# A file bigger than this many megabytes is not read: it stays in the inbox for review, with the reason.
[parsing]
max_file_mb = 50

# The diagnostic log microfiche writes under .microfiche/ (separate from the audit log).
# level: how much it records (DEBUG, INFO, WARNING, ERROR or CRITICAL). file: its name, a plain file
# name, not a path, and not the name of one of microfiche's own files there (audit.log, ledger.jsonl and
# so on). The file is rotated to a backup at max_bytes; backup_count is how many backups to keep (0 never
# rotates, so the file grows without limit).
[logging]
level = "INFO"
file = "microfiche.log"
max_bytes = 1048576
backup_count = 3

# Folder name/glob patterns never treated as a category and never descended into by
# taxonomy discovery or `reclassify`. Extend this with your own non-category folders
# (templates, attachments, archives you don't want touched, etc).
#
# Note: the library's inbox (`library_inbox` under [library_structure] above) and microfiche's own .microfiche/ folder are
# always excluded automatically - they need no entry here. Other dot-prefixed folders (.obsidian/,
# .git/) are covered by the ".*" wildcard below. `sorting*` and `_sorting*` are kept so that
# inbox-style folders stay out of the taxonomy even when they aren't this library's own inbox -
# for example the inboxes of sub-libraries nested inside it.
[exclusions]
exclude = ["sorting*", "_sorting*", ".*", "_*"]

[naming_rules]
rules = {}
