[project]
name = "microfiche"
version = "0.1.5"
description = "Automatically organize, categorize, and file project reference materials into a structured library."
authors = [{ name = "Richard Gledhill", email = "rich.gledhill73@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.urls]
Homepage = "https://richard-gledhill.github.io/microfiche/"
Repository = "https://github.com/richard-gledhill/microfiche"
Documentation = "https://richard-gledhill.github.io/microfiche/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]
dependencies = [
    "core",
    "cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microfiche"]

[tool.uv]
default-groups = ["dev", "dependencies"]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
]

[tool.uv.sources]
core = { workspace = true}
cli = { workspace = true }

[tool.mypy]
files = ["packages/core/src", "packages/cli/src"]
# microfiche is a namespace package (no __init__.py) shared by two source folders, so mypy needs to be told where
# each one starts, or it cannot tell `microfiche.core` is the module it is about to check.
mypy_path = ["packages/core/src", "packages/cli/src"]
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# No type stubs published upstream for these; ollama/openai are core's optional "ai" extra
# and aren't installed by a plain `uv sync` (use `uv sync --package core --extra ai`).
module = ["pymupdf", "ollama", "openai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Package names, not paths - coverage.py maps these to packages/{core,cli}/src/microfiche/{core,cli} via
# the workspace's editable installs regardless of which src/ directory they actually live in.
source = ["microfiche.core", "microfiche.cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# The floor CI and `make test` enforce on the whole of core and cli. The measured baseline was 97.6% (Windows,
# 2026-10-13); it is set below that so a platform-specific branch that one OS does not run cannot fail the build.
# Raise it, never lower it, once the Linux figure from CI is known (docs/development/mvp-build-plan.md, Stage 6).
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
extend-exclude = ["docs"]
# pre-commit passes ruff explicit staged filenames rather than running `ruff .`, which bypasses
# exclude/extend-exclude by default - force-exclude makes the docs/ exclusion apply either way.
force-exclude = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    "G",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true
