# .microfiche/microfiche-config.toml — this library's microfiche configuration.

# The shape of the library: the name of its inbox, and the depth of the group/category hierarchy.
# library_inbox: the one folder at the library root where new documents are dropped. It must be a
# plain folder name, not a path.
# Depth of the group/category hierarchy (default: 2 levels).
[library_structure]
library_inbox = "_sorting"
depth = 2

# How confident microfiche must be (0 to 1) before it files a document without asking. Anything
# below this is left in _sorting/ for review. How sure each kind of match is today: exact group or
# category name 0.9-1.0, filename rule 0.95, keyword hint 0.75, AI answer 0.70. The default, 0.75,
# files on all of those except AI answers. Raise it to 0.8 to hold keyword-hint matches for review
# too, or lower it to 0.7 to let AI answers file. It was measured, not guessed: see
# docs/development/calibration.md.
[classification]
confidence_threshold = 0.75

# Folder name/glob patterns never treated as a category and never descended into by
# taxonomy discovery or `reclassify`. Extend this with your own non-category folders
# (templates, attachments, archives you don't want touched, etc).
#
# Note: the library's inbox (`library_inbox` under [library_structure] above) and microfiche's own .microfiche/ folder are
# always excluded automatically - they need no entry here. Other dot-prefixed folders (.obsidian/,
# .git/) are covered by the ".*" wildcard below. `sorting*` and `_sorting*` are kept so that
# inbox-style folders stay out of the taxonomy even when they aren't this library's own inbox -
# for example the inboxes of sub-libraries nested inside it.
[exclusions]
exclude = ["sorting*", "_sorting*", ".*", "_*"]

[naming_rules]
rules = {}
