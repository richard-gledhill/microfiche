# .microfiche/microfiche-config.toml — this library's microfiche configuration.

# Depth of the group/category hierarchy (default: 2 levels).
[library_structure]
depth = 2
levels = ["group", "category"]
file_target_level = 2

# Folder name/glob patterns never treated as a category and never descended into by
# taxonomy discovery or `reclassify`. Extend this with your own non-category folders
# (templates, attachments, archives you don't want touched, etc).
#
# Note: microfiche's own operational folders (.microfiche/, .obsidian/, .git/) are all
# dot-prefixed and already covered by the ".*" wildcard below - they don't need their own
# entries. The sorting inbox (_sorting/) isn't dot-prefixed (so if used with Obsidian or similar it stays visible on
# purpose, as the active drop zone), so it does need to be listed explicitly. `sorting*` is also
# excluded for compatibility with libraries still using the older folder name.
[exclusions]
exclude = ["sorting*",
  "_sorting*",
  ".*",
  "_*",
]

# Keyword hints that help the rules engine match content to a category that already exists
# as a folder in the library. These are hints, not the category list itself - the category
# list is discovered from the library's existing folders (see core.library.taxonomy).
# Todo: review how this is included in confg. might be better to move into separate library-specific config file.
[category_hints.categories]
"01 Requirements" = ["requirement", "user story", "acceptance criteria"]
"02 Architecture" = ["architecture", "design decision", "system diagram"]
"03 Research" = ["research", "article", "whitepaper"]
"04 Meeting Notes" = ["meeting", "sprint review", "retrospective"]
"05 Correspondence" = ["email", "correspondence"]

# Filename-pattern rules, checked before keyword hints. `pattern` is a glob matched against
# the lowercased filename; `category` must be a category name that exists in the target group.
# Todo: as with category_hints this might be better to move into a separate library specific file
[filing_rules]
rules = [
  { pattern = "requirements*.docx", category = "01 Requirements" },
  { pattern = "architecture*.pdf", category = "02 Architecture" },
  { pattern = "meeting-notes*", category = "04 Meeting Notes" },
]

# Regex pattern -> replacement, applied to filenames before filing (see core.library.naming).
# Empty by default: the MVP leaves filenames untouched
[naming_rules]
rules = {}

# Category sets for a future `create-library`/`init` command (core.library.templates).
# todo: is this required
[library_templates]
software_project = ["01 Requirements", "02 Architecture", "03 Research", "04 Meeting Notes", "05 Correspondence", "06 Reference Material", "99 Archive"]
personal_project = ["01 Ideas", "02 Research", "03 Notes", "99 Archive"]

# suggest: apply + propose new tags for review | strict: only apply tags already in TagIndex.md
# | off: tag freely, don't consult TagIndex.md at all
[obsidian]
enabled = false
tag_index_path = "TagIndex.md"
tag_mode = "suggest"  # suggest | strict | off
