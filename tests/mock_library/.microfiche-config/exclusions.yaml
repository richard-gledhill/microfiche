# Folder name/glob patterns never treated as a category and never descended into by
# taxonomy discovery or `resort`. Extend this with your own non-category folders
# (templates, attachments, archives you don't want touched, etc).
#
# Note: microfiche's own operational folders (.microfiche-config/, .logs/, .obsidian/, .git/) are all
# dot-prefixed and already covered by the ".*" wildcard below - they don't need their own
# entries. The sorting inbox isn't dot-prefixed (it stays visible in Obsidian on purpose, as
# the active drop zone), so it does need to be listed explicitly.
exclude:
  - "sorting*"
  - "_sorting*"
  - ".*"
  - "_*"
